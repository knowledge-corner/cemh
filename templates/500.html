<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Something went wrong — {{ clinic_name }}</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #eff9f7; color: #0c4a54;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 30rem; margin: 1.5rem; padding: 2.5rem 2rem; text-align: center;
    background: #ffffff; border-radius: 1rem; box-shadow: 0 10px 30px rgba(12, 74, 84, .08);
  }
  .code { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: #00a08b; font-weight: 600; }
  h1 { margin: .5rem 0 1rem; font-size: 1.4rem; }
  p { margin: 0 0 .75rem; line-height: 1.5; }
  .phone { font-weight: 600; color: #0c4a54; text-decoration: none; }
  .btn {
    display: inline-block; margin-top: 1.25rem; padding: .6rem 1.4rem; border-radius: .5rem;
    background: #00c2a8; color: #ffffff; text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="code">Error 500</p>
    <h1>Something went wrong on our end.</h1>
    <p>This has been logged, and is not something you did. Please try again in a moment.</p>
    {% if clinic_phone %}
      <p>If it keeps happening, call the clinic directly on
        <a class="phone" href="tel:{{ clinic_phone }}">{{ clinic_phone }}</a>.</p>
    {% endif %}
    <a class="btn" href="/">Back to the homepage</a>
  </div>
</body>
</html>
