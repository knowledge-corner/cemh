{% extends "base.html" %}

{% block title %}{{ heading }} — {{ clinic_name }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">{{ heading }}</h1>
    <p class="page-header__sub">Signed in as {{ request.user.display_name }}</p>
  </div>
</div>

<div class="card">
  <div class="card__body">
    <div class="empty">
      <div class="empty__icon">🚧</div>
      <div class="empty__title">Coming soon</div>
      <div class="empty__hint">{{ message }}</div>
    </div>
  </div>
</div>
{% endblock %}
