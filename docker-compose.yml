# Local development only. Runs Postgres alongside the app so a developer needs
# nothing installed but Docker.
#
#   docker compose up --build
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_demo
#
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinic_pms
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_pms"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic_pms
      SECRET_KEY: dev-only-insecure-key-do-not-use-in-production
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
