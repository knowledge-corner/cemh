# Local development only. Runs Postgres alongside the app so a developer needs
# nothing installed but Docker.
#
#   docker compose up --build -d      # -d, so the next commands get a prompt
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_demo
#   docker compose exec web pytest
#
# Then http://127.0.0.1:8000/ — sign in as vrushali / clinicdemo2026.
# `docker compose logs -f web` if something does not come up.
#
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinic_pms
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_pms"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic_pms
      SECRET_KEY: dev-only-insecure-key-do-not-use-in-production
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
